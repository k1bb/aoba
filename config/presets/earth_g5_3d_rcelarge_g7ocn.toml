# =============================================================================
# AOBA Coupled Earth System Model — Unified Configuration & Parameter Registry
# High-Top G5 Atmosphere + 3D RCE_large (16x64 @ 4 km) CRM + G7 28 km OGCM
# with Prognostic Ozone, RRTMGP + 3D TICA, 6-Class 2M Microphysics, and Paired
# Online CRM + ICA Radiation Self-Distillation.
# =============================================================================

# --- Horizontal, Vertical & Subgrid CRM Mesh Settings ---
[grid]
glevel = 5
nz = 56
z_top = 65000.0
dz_min = 60.0
z_sponge_base = 52000.0
tau_sponge_min = 300.0
terrain_scale_exp = 1.5
