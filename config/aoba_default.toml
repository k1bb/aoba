icesheet_ema_years = 5.0
icesheet_accel_factor = 100.0
icesheet_accel_spinup_years = 0.0
icesheet_isostasy_tau_yr = 1000.0

# --- Output Files, Time Intervals (Mean vs Instantaneous) & Restart ---
[output]
