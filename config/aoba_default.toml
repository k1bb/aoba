calendar_type = "gregorian"
insolation_mode = "seasonal"
fixed_insolation_date = "2000-03-20"
diurnal_cycle = true
use_earth2014 = true
earth2014_dir = "data/boundary/earth2014_5min"
earth2014_stride = 2
enable_superparam = true
enable_dust = true
dust_emis_factor = 1.5e-05
h_ml_ocean = 50.0
re_liq_um = 10.0
re_ice_um = 48.0
cloud_sw_inhomog = 0.85

# --- Dynamic Equilibrium / Accelerated SIA Ice-Sheet Options ---
[icesheet]
