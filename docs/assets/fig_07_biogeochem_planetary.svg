<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" role="img" aria-label="Biogeochemical Loops, Paleoclimate Water Isotopes, Ice Sheets &amp; Planetary Regimes">
  <defs>
    <style>
      .bg { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 14; }
      .title { font: 700 17px "Noto Sans", "Noto Sans JP", "Hiragino Sans", sans-serif; fill: #0f172a; }
      .sub { font: 400 12px "Noto Sans", "Noto Sans JP", "Hiragino Sans", sans-serif; fill: #475569; }
      .box-t { font: 700 13px "Noto Sans", "Noto Sans JP", "Hiragino Sans", sans-serif; fill: #0f172a; }
      .box-s { font: 400 11px "Noto Sans", "Noto Sans JP", "Hiragino Sans", sans-serif; fill: #334155; }
      .mono { font: 600 11px "Source Code Pro", ui-monospace, SFMono-Regular, Menlo, monospace; fill: #0f172a; }
      .lbl { font: 600 11px "Noto Sans", "Noto Sans JP", "Hiragino Sans", sans-serif; fill: #1e293b; }
      .badge { font: 700 10px "Source Code Pro", ui-monospace, SFMono-Regular, Menlo, monospace; fill: #ffffff; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#15803d"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
  </defs>
  <rect class="bg" x="2" y="2" width="856" height="396" rx="14"/>
  <text class="title" x="24" y="32">Biogeochemical Loops, Paleoclimate Water Isotopes, Ice Sheets &amp; Planetary Regimes</text>
  <text class="sub" x="24" y="51">From modern climate change to Ice-Age d18O cores, Snowball Earth, and tidally locked exoplanets within one equation set</text>
  <line x1="24" y1="62" x2="836" y2="62" stroke="#e2e8f0" stroke-width="1.2"/>
  <rect x="24" y="78" width="400" height="148" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <rect x="353" y="85" width="63" height="17" rx="8" fill="#b45309"/>
  <text class="badge" x="384.5" y="97" text-anchor="middle">Sec. 10</text>
  <text class="box-t" x="36" y="100">1. Closed Carbon, Methane, N2O &amp; Ozone Cycles</text>
  <text class="box-s" x="36" y="118">co2_mode: constant | scenario | csv | prognostic (+ 3D FCT)</text>
  <text class="box-s" x="36" y="134">  dCO2/dt = (E_anthro + E_volc - NBP_land - F_ocn - F_weath) / 2.124</text>
  <text class="box-s" x="36" y="150">CH4 &amp; N2O: Wetlands + Fire + Ocean OMZ &lt;-&gt; OH &amp; Strat UV sinks</text>
  <text class="box-s" x="36" y="166">o3_mode: rcemip | latitude_seasonal | climatology | prognostic</text>
  <text class="box-s" x="36" y="182">  3D Chapman UV + Catalytic NOx/HOx + PSC + EEO dry deposition</text>
  <text class="box-s" x="36" y="198">Volcanic SO2-&gt;H2SO4 (Bateman) &amp; 11-yr Schwabe Solar Cycle</text>
  <rect x="440" y="78" width="396" height="148" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/>
  <rect x="751" y="85" width="77" height="17" rx="8" fill="#0369a1"/>
  <text class="badge" x="789.5" y="97" text-anchor="middle">Sec. 10.5</text>
  <text class="box-t" x="452" y="100">2. Stable Water Isotopes (H2^18O, HDO) &amp; Ice Cores</text>
  <text class="box-s" x="452" y="118">enable_water_isotopes: 3D VSMOW-normalized q_v_18o, q_v_hdo</text>
  <text class="box-s" x="452" y="134">Ocean evaporation: Craig-Gordon (1965) kinetic fractionation</text>
  <text class="box-s" x="452" y="150">Condensation: Majoube (1971) &amp; Merlivat-Nief (1967) equilibrium</text>
  <text class="box-s" x="452" y="166">Ice supersaturation: Jouzel-Merlivat (1984) -&gt; realistic d-excess</text>
  <text class="box-s" x="452" y="182">Exact Rayleigh rainout distillation -&gt; Snowpack d18O archive</text>
  <text class="box-s" x="452" y="198">Direct proxy comparison with Greenland &amp; Antarctic ice cores!</text>
  <rect x="24" y="246" width="400" height="134" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="1.6"/>
  <rect x="353" y="253" width="63" height="17" rx="8" fill="#334155"/>
  <text class="badge" x="384.5" y="265" text-anchor="middle">Sec. 11</text>
  <text class="box-t" x="36" y="268">3. Dynamic Ice Sheet &amp; Milankovitch Paleoclimate</text>
  <text class="box-s" x="36" y="286">enable_dynamic_icesheet: Glen n=3 SIA + Bedrock Isostasy</text>
  <text class="box-s" x="36" y="302">Optional 10x-100x ice-sheet acceleration + vertical grid remap</text>
  <text class="box-s" x="36" y="318">enable_milankovitch_orbit: Berger (1978) / Laskar (2004)</text>
  <text class="box-s" x="36" y="334">  continuous eccentricity, obliquity, &amp; precession evolution</text>
  <text class="box-s" x="36" y="350">enable_silicate_weathering: Walker (1981) geologic thermostat</text>
  <rect x="440" y="246" width="396" height="134" rx="10" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.6"/>
  <rect x="751" y="253" width="77" height="17" rx="8" fill="#6b21a8"/>
  <text class="badge" x="789.5" y="265" text-anchor="middle">Sec. 11.4</text>
  <text class="box-t" x="452" y="268">4. Universal Planetary &amp; Exoplanet Presets</text>
  <text class="box-s" x="452" y="286">planet_preset (100% map-free universal equations):</text>
  <text class="box-s" x="452" y="302">  &quot;earth&quot;           : Modern / Paleo Earth (Earth2014)</text>
  <text class="box-s" x="452" y="318">  &quot;aquaplanet&quot;      : 100% Ocean, zero topography (ITCZ/MJO)</text>
  <text class="box-s" x="452" y="334">  &quot;snowball_earth&quot;  : Faint young Sun + glaciated + weathering</text>
  <text class="box-s" x="452" y="350">  &quot;tidally_locked&quot; / &quot;trappist1e&quot;: Fixed substellar eyeball world</text>
  <text class="box-s" x="452" y="366">  &quot;mars_like&quot;       : Cold arid bare-land terrestrial planet</text>
  <line x1="424" y1="152" x2="438" y2="152" stroke="#334155" stroke-width="1.6" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <line x1="224" y1="226" x2="224" y2="244" stroke="#334155" stroke-width="1.6" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <line x1="638" y1="226" x2="638" y2="244" stroke="#7e22ce" stroke-width="1.6" marker-end="url(#arr)" marker-start="url(#arr)"/>
</svg>
