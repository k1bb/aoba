<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" width="860" height="400" role="img" aria-label="Ocean Circulation (forcing.ocean_mode), Waves, Sea Ice, &amp; Marine Biogeochemistry">
  <defs>
    <style>
      .bg { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 14; }
      .title { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", sans-serif; fill: #0f172a; }
      .sub { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", sans-serif; fill: #475569; }
      .box-t { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", sans-serif; fill: #0f172a; }
      .box-s { font: 400 11px -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", sans-serif; fill: #334155; }
      .mono { font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #0f172a; }
      .lbl { font: 600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", sans-serif; fill: #1e293b; }
      .badge { font: 700 10px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #ffffff; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#15803d"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
  </defs>
  <rect class="bg" x="2" y="2" width="856" height="396" rx="14"/>
  <text class="title" x="24" y="32">Ocean Circulation (forcing.ocean_mode), Waves, Sea Ice, &amp; Marine Biogeochemistry</text>
  <text class="sub" x="24" y="51">Choose 3D multi-layer OGCM (with optional fine ocean_glevel) or fast 1.5-layer Ekman ocean, coupled to waves, EVP-ITD sea ice, and FlexPFT BGC</text>
  <line x1="24" y1="62" x2="836" y2="62" stroke="#e2e8f0" stroke-width="1.2"/>
  <rect x="24" y="78" width="250" height="122" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
  <rect x="189" y="85" width="77" height="17" rx="8" fill="#475569"/>
  <text class="badge" x="227.5" y="97" text-anchor="middle">1.5-LAYER</text>
  <text class="box-t" x="36" y="100">Option A: &quot;ekman_sw&quot;</text>
  <text class="box-s" x="36" y="118">1.5-Layer Wind-Driven Ekman</text>
  <text class="box-s" x="36" y="134">+ Shallow-Water Rossby/Kelvin</text>
  <text class="box-s" x="36" y="150">Zero prescribed Q-fluxes.</text>
  <text class="box-s" x="36" y="166">Fast conceptual &amp; aquaplanet</text>
  <text class="box-s" x="36" y="182">  climate experiments.</text>
  <rect x="24" y="214" width="250" height="166" rx="10" fill="#cffafe" stroke="#0891b2" stroke-width="1.6"/>
  <rect x="203" y="221" width="63" height="17" rx="8" fill="#0e7490"/>
  <text class="badge" x="234.5" y="233" text-anchor="middle">DEFAULT</text>
  <text class="box-t" x="36" y="236">Option B: &quot;ogcm_3d&quot; (Default)</text>
  <text class="box-s" x="36" y="254">Full 3D Multi-Layer SCVT OGCM</text>
  <text class="box-s" x="36" y="270">Earth2014 bathymetry, 18+ layers</text>
  <text class="box-s" x="36" y="286">Zalesak FCT T/S + z* free surface</text>
  <text class="box-s" x="36" y="302">Scale-aware GM90 + Redi + Submeso</text>
  <text class="box-s" x="36" y="318">KPP mixed layer + tidal mixing</text>
  <text class="box-s" x="36" y="334">Independent Fine Grid (ocean_glevel)</text>
  <text class="box-s" x="36" y="350">Current-relative wind (u_a - u_o)</text>
  <rect x="298" y="78" width="260" height="140" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <rect x="494" y="85" width="56" height="17" rx="8" fill="#1d4ed8"/>
  <text class="badge" x="522.0" y="97" text-anchor="middle">WAVES</text>
  <text class="box-t" x="310" y="100">Surface Waves &amp; Sea Spray</text>
  <text class="box-s" x="310" y="118">enable_wave_coupling:</text>
  <text class="box-s" x="310" y="134">Prognostic Hs &amp; peak period Tp</text>
  <text class="box-s" x="310" y="150">Stokes drift -&gt; Langmuir KPP boost</text>
  <text class="box-s" x="310" y="166">Wave-age Charnock roughness z0</text>
  <text class="box-s" x="310" y="182">High-wind sea-spray enthalpy flux</text>
  <text class="box-s" x="310" y="198">  (Fairall/Andreas for cyclones)</text>
  <rect x="298" y="232" width="260" height="148" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.6"/>
  <rect x="487" y="239" width="63" height="17" rx="8" fill="#0369a1"/>
  <text class="badge" x="518.5" y="251" text-anchor="middle">SEA ICE</text>
  <text class="box-t" x="310" y="254">EVP-ITD Dynamic Sea Ice</text>
  <text class="box-s" x="310" y="272">enable_seaice_evp_itd:</text>
  <text class="box-s" x="310" y="288">5-category thickness distribution</text>
  <text class="box-s" x="310" y="304">Elastic-Viscous-Plastic rheology</text>
  <text class="box-s" x="310" y="320">Fused GPU 60-subcycle EVP kernel</text>
  <text class="box-s" x="310" y="336">Snow cover + SNICAR BC darkening</text>
  <text class="box-s" x="310" y="352">Brine rejection -&gt; deep convection</text>
  <rect x="582" y="78" width="254" height="302" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
  <rect x="744" y="85" width="84" height="17" rx="8" fill="#15803d"/>
  <text class="badge" x="786.0" y="97" text-anchor="middle">MARINE BGC</text>
  <text class="box-t" x="594" y="100">FlexPFT Marine BGC &amp; O2/OMZ</text>
  <text class="box-s" x="594" y="118">enable_ocean_bgc (+ enable_ocean_o2_omz):</text>
  <text class="box-s" x="594" y="134"></text>
  <text class="box-s" x="594" y="150">• 3D Prognostic Pools:</text>
  <text class="box-s" x="594" y="166">  NO3, PO4, dFe, DIC, Alk, O2, POC</text>
  <text class="box-s" x="594" y="182">• Emergent FlexPFT Phytoplankton:</text>
  <text class="box-s" x="594" y="198">  Dynamic Chl:C &amp; optimal size/light</text>
  <text class="box-s" x="594" y="214">• Dust Fe &amp; LNOx + River nutrients</text>
  <text class="box-s" x="594" y="230">• Carbonate Solver (float64 pCO2):</text>
  <text class="box-s" x="594" y="246">  Air-sea fgCO2 &lt;-&gt; Prognostic CO2</text>
  <text class="box-s" x="594" y="262">• Dissolved O2 &amp; Suboxic OMZ:</text>
  <text class="box-s" x="594" y="278">  Garcia-Gordon solubility,</text>
  <text class="box-s" x="594" y="294">  O2 &lt; 20 mmol/m3 -&gt; Denitrification</text>
  <text class="box-s" x="594" y="310">  &amp; Marine N2O emission</text>
  <text class="box-s" x="594" y="326">• DMS production -&gt; Sulfate CCN</text>
  <line x1="274" y1="268" x2="296" y2="148" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-blue)" marker-start="url(#arr-blue)"/>
  <line x1="274" y1="306" x2="296" y2="306" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arr-blue)" marker-start="url(#arr-blue)"/>
  <line x1="558" y1="148" x2="580" y2="148" stroke="#15803d" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <line x1="558" y1="306" x2="580" y2="306" stroke="#15803d" stroke-width="1.8" marker-end="url(#arr-green)" marker-start="url(#arr-green)"/>
</svg>
