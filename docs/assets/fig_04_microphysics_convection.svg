<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 422" width="860" height="422" role="img" aria-label="Cloud Microphysics Schemes (forcing.microphysics_scheme) &amp; Hydrometeor Pathways">
  <defs>
    <style>
      .bg { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 14; }
      .title { font: 700 17px "Noto Sans", "Noto Sans JP", "Hiragino Sans", sans-serif; fill: #0f172a; }
      .sub { font: 400 12px "Noto Sans", "Noto Sans JP", "Hiragino Sans", sans-serif; fill: #475569; }
      .box-t { font: 700 13px "Noto Sans", "Noto Sans JP", "Hiragino Sans", sans-serif; fill: #0f172a; }
      .box-s { font: 400 11px "Noto Sans", "Noto Sans JP", "Hiragino Sans", sans-serif; fill: #334155; }
      .mono { font: 600 11px "Source Code Pro", ui-monospace, SFMono-Regular, Menlo, monospace; fill: #0f172a; }
      .lbl { font: 600 11px "Noto Sans", "Noto Sans JP", "Hiragino Sans", sans-serif; fill: #1e293b; }
      .badge { font: 700 10px "Source Code Pro", ui-monospace, SFMono-Regular, Menlo, monospace; fill: #ffffff; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#15803d"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
  </defs>
  <rect class="bg" x="2" y="2" width="856" height="418" rx="14"/>
  <text class="title" x="24" y="32">Cloud Microphysics Schemes (forcing.microphysics_scheme) &amp; Hydrometeor Pathways</text>
  <text class="sub" x="24" y="51">Select 1-moment, 2-moment aerosol-cloud, or full 6-class 2-moment microphysics inside cumulus-free explicit CRM columns</text>
  <line x1="24" y1="62" x2="836" y2="62" stroke="#e2e8f0" stroke-width="1.2"/>
  <rect x="24" y="76" width="256" height="108" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
  <rect x="202" y="83" width="70" height="17" rx="8" fill="#475569"/>
  <text class="badge" x="237.0" y="95" text-anchor="middle">1-MOMENT</text>
  <text class="box-t" x="36" y="98">1. &quot;one_moment&quot; (SAM 1M)</text>
  <text class="box-s" x="36" y="116">Prognostic: q_n (total non-precip),</text>
  <text class="box-s" x="36" y="132">  q_p (total precip). Fixed r_e.</text>
  <text class="box-s" x="36" y="148">Diagnostic T-partitioning of</text>
  <text class="box-s" x="36" y="164">  liquid/ice &amp; rain/snow/graupel.</text>
  <text class="box-s" x="36" y="180">Lowest memory &amp; compute cost.</text>
  <rect x="302" y="76" width="256" height="108" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/>
  <rect x="487" y="83" width="63" height="17" rx="8" fill="#0284c7"/>
  <text class="badge" x="518.5" y="95" text-anchor="middle">DEFAULT</text>
  <text class="box-t" x="314" y="98">2. &quot;two_moment&quot; (Default KK00)</text>
  <text class="box-s" x="314" y="116">Adds prognostic N_c &amp; N_i.</text>
  <text class="box-s" x="314" y="132">Aerosol-aware CCN/INP activation</text>
  <text class="box-s" x="314" y="148">  (Dust, SeaSalt, SO4, SOA).</text>
  <text class="box-s" x="314" y="164">Khairoutdinov-Kogan autoconversion</text>
  <text class="box-s" x="314" y="180">  &amp; prognostic r_e -&gt; Radiation.</text>
  <rect x="580" y="76" width="256" height="108" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/>
  <rect x="744" y="83" width="84" height="17" rx="8" fill="#6d28d9"/>
  <text class="badge" x="786.0" y="95" text-anchor="middle">6-CLASS 2M</text>
  <text class="box-t" x="592" y="98">3. &quot;six_class_2m&quot; (Morrison)</text>
  <text class="box-s" x="592" y="116">Full 6-class 2-moment hydrometeors:</text>
  <text class="box-s" x="592" y="132">  Cloud (q_c,N_c), Ice (q_i,N_i),</text>
  <text class="box-s" x="592" y="148">  Rain (q_r,N_r), Snow (q_s,N_s),</text>
  <text class="box-s" x="592" y="164">  Rimed Graupel (q_g,N_g).</text>
  <text class="box-s" x="592" y="180">Fused GPU kernel + true q_g lightning.</text>
  <rect x="24" y="206" width="812" height="198" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text class="box-t" x="38" y="228">Hydrometeor Phase-Change, Precipitation, &amp; Electrification Pathways inside Explicit CRM Columns</text>
  <rect x="44" y="246" width="150" height="62" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.6"/>
  <text class="box-t" x="56" y="268">Water Vapor (q_v)</text>
  <text class="box-s" x="56" y="286">Supersaturation adjustment</text>
  <text class="box-s" x="56" y="302">Condensation / Deposition</text>
  <rect x="244" y="246" width="175" height="62" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text class="box-t" x="256" y="268">Cloud Water &amp; Ice</text>
  <text class="box-s" x="256" y="286">q_c, N_c (liquid) | q_i, N_i (ice)</text>
  <text class="box-s" x="256" y="302">Activated by CCN &amp; Dust INP</text>
  <rect x="470" y="246" width="170" height="62" rx="10" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.6"/>
  <text class="box-t" x="482" y="268">Rain, Snow, Graupel</text>
  <text class="box-s" x="482" y="286">q_r, q_s, q_g (+ N_r, N_s, N_g)</text>
  <text class="box-s" x="482" y="302">Autoconv, Accretion, Riming</text>
  <rect x="684" y="246" width="134" height="62" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <text class="box-t" x="696" y="268">Surface &amp; LNOx</text>
  <text class="box-s" x="696" y="286">Rain/Snow -&gt; MAML</text>
  <text class="box-s" x="696" y="302">Graupel-Ice -&gt; LNOx</text>
  <line x1="194" y1="277" x2="242" y2="277" stroke="#0284c7" stroke-width="2" marker-end="url(#arr-blue)" marker-start="url(#arr-blue)"/>
  <line x1="419" y1="277" x2="468" y2="277" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="640" y1="277" x2="682" y2="277" stroke="#d97706" stroke-width="2" marker-end="url(#arr-amber)"/>
  <path d="M 555 308 L 555 352 L 119 352 L 119 310" fill="none" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arr)"/>
  <text class="lbl" x="337" y="346" text-anchor="middle">Sub-cloud Evaporation / Sublimation (Cold Pools &amp; Convective Downdrafts)</text>
  <text class="box-s" x="44" y="384">Sedimentation: Subcycled CFL-safe / exact exponential vertical fall speed (v_r &gt; v_g &gt; v_s &gt; v_i) with exact water &amp; enthalpy conservation.</text>
</svg>
