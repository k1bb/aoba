<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 426" width="860" height="426" role="img" aria-label="Atmospheric Radiation Transfer &amp; Selectable Scheme Hierarchy">
  <defs>
    <style>
      .bg { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 14; }
      .title { font: 700 17px "Noto Sans", "Noto Sans JP", "Hiragino Sans", sans-serif; fill: #0f172a; }
      .sub { font: 400 12px "Noto Sans", "Noto Sans JP", "Hiragino Sans", sans-serif; fill: #475569; }
      .box-t { font: 700 13px "Noto Sans", "Noto Sans JP", "Hiragino Sans", sans-serif; fill: #0f172a; }
      .box-s { font: 400 11px "Noto Sans", "Noto Sans JP", "Hiragino Sans", sans-serif; fill: #334155; }
      .mono { font: 600 11px "Source Code Pro", ui-monospace, SFMono-Regular, Menlo, monospace; fill: #0f172a; }
      .lbl { font: 600 11px "Noto Sans", "Noto Sans JP", "Hiragino Sans", sans-serif; fill: #1e293b; }
      .badge { font: 700 10px "Source Code Pro", ui-monospace, SFMono-Regular, Menlo, monospace; fill: #ffffff; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#15803d"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
  </defs>
  <rect class="bg" x="2" y="2" width="856" height="422" rx="14"/>
  <text class="title" x="24" y="32">Atmospheric Radiation Transfer &amp; Selectable Scheme Hierarchy</text>
  <text class="sub" x="24" y="51">Choose one of four physically consistent radiation schemes via [forcing] rad_scheme, plus optional 3D TICA cloud scattering</text>
  <line x1="24" y1="62" x2="836" y2="62" stroke="#e2e8f0" stroke-width="1.2"/>
  <rect x="24" y="76" width="330" height="334" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text class="box-t" x="38" y="98">A. Two-Stream Radiative Transfer Physics</text>
  <rect x="44" y="114" width="290" height="34" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text class="lbl" x="189" y="135" text-anchor="middle">Top of Atmosphere (TOA): S0 * mu0, OLR, ASR</text>
  <rect x="44" y="160" width="290" height="62" rx="6" fill="#e0e7ff" stroke="#6366f1"/>
  <text class="lbl" x="189" y="180" text-anchor="middle">Stratosphere: O3 UV/9.6um, CO2 15um, Volcanic H2SO4</text>
  <text class="box-s" x="189" y="198" text-anchor="middle">11-yr Solar Cycle TSI/UV + Pinatubo/SAI Aerosols</text>
  <rect x="44" y="232" width="290" height="92" rx="6" fill="#e0f2fe" stroke="#0284c7"/>
  <text class="lbl" x="189" y="252" text-anchor="middle">Troposphere: H2O, CO2, CH4, N2O, Clouds, Aerosols</text>
  <text class="box-s" x="189" y="270" text-anchor="middle">Liquid &amp; Ice Cloud Optics (r_e, chi_SW inhomogeneity)</text>
  <text class="box-s" x="189" y="286" text-anchor="middle">5-Species Aerosols (Dust, SeaSalt, SO4, BC, OC/SOA)</text>
  <text class="box-s" x="189" y="302" text-anchor="middle">Optional 3D TICA: horizontal tilted-beam cloud shift</text>
  <rect x="44" y="336" width="290" height="58" rx="6" fill="#dcfce7" stroke="#15803d"/>
  <text class="lbl" x="189" y="356" text-anchor="middle">Surface: Land (VIS/NIR Canopy) / Ocean / Snow-Ice</text>
  <text class="box-s" x="189" y="374" text-anchor="middle">SNICAR BC/Dust Snow Albedo + PAR -> EEO Plants</text>
  <line x1="76" y1="148" x2="76" y2="334" stroke="#d97706" stroke-width="2.4" marker-end="url(#arr-amber)"/>
  <text class="lbl" x="62" y="236" fill="#b45309">SW</text>
  <line x1="302" y1="334" x2="302" y2="148" stroke="#dc2626" stroke-width="2.4" marker-end="url(#arr-red)"/>
  <text class="lbl" x="308" y="236" fill="#b91c1c">LW</text>
  <rect x="374" y="76" width="462" height="334" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text class="box-t" x="388" y="98">B. Selectable Radiation Schemes (forcing.rad_scheme)</text>
  <rect x="390" y="112" width="430" height="62" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
  <rect x="756" y="119" width="56" height="17" rx="8" fill="#475569"/>
  <text class="badge" x="784.0" y="131" text-anchor="middle">FAST</text>
  <text class="box-t" x="402" y="134">1. &quot;four_band&quot; — Fast Analytical 4-Band (2 SW + 2 LW)</text>
  <text class="box-s" x="402" y="152">Zero lookup tables; ideal for teaching, aquaplanets, &amp; rapid prototyping</text>
  <text class="box-s" x="402" y="168">Gases: H2O, CO2, O3 (UV/9.6um)  |  Fastest throughput</text>
  <rect x="390" y="184" width="430" height="62" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/>
  <rect x="749" y="191" width="63" height="17" rx="8" fill="#0284c7"/>
  <text class="badge" x="780.5" y="203" text-anchor="middle">DEFAULT</text>
  <text class="box-t" x="402" y="206">2. &quot;ckd&quot; — 16-Band / 50 g-pt Correlated-k (Default)</text>
  <text class="box-s" x="402" y="224">Self-contained deterministic k-distributions; exact H2O/CO2/CH4/N2O/O3</text>
  <text class="box-s" x="402" y="240">Fused Metal/CUDA kernel; balanced accuracy &amp; multi-decadal speed</text>
  <rect x="390" y="256" width="430" height="62" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <rect x="742" y="263" width="70" height="17" rx="8" fill="#d97706"/>
  <text class="badge" x="777.0" y="275" text-anchor="middle">HIGH-RES</text>
  <text class="box-t" x="402" y="278">3. &quot;ckd_hd&quot; — 29-Band / 111 g-pt MSTRN11-Class CKD</text>
  <text class="box-s" x="402" y="296">Chou LW cloud scattering + 5-species aerosols + fine H2O/CO2 overlap</text>
  <text class="box-s" x="402" y="312">Fused GPU kernel (15x speedup); zero external files required</text>
  <rect x="390" y="328" width="430" height="66" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.6"/>
  <rect x="756" y="335" width="56" height="17" rx="8" fill="#6d28d9"/>
  <text class="badge" x="784.0" y="347" text-anchor="middle">HITRAN</text>
  <text class="box-t" x="402" y="350">4. &quot;rrtmgp&quot; — Official HITRAN / MT_CKD 4.1 (240 g-pts)</text>
  <text class="box-s" x="402" y="368">Auto-fetches BSD-3 RRTMGP tables (128 LW + 112 SW g-pts); 2-gas eta</text>
  <text class="box-s" x="402" y="384">Benchmark CMIP-grade accuracy; fused GPU kernel (110-168x speedup)</text>
</svg>
