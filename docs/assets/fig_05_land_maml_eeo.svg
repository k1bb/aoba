<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 394" width="860" height="394" role="img" aria-label="MAML Subgrid Land, Autonomous EEO Biosphere, Hydrology &amp; Terrestrial C/N">
  <defs>
    <style>
      .bg { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 14; }
      .title { font: 700 17px "Noto Sans", "Noto Sans JP", "Hiragino Sans", sans-serif; fill: #0f172a; }
      .sub { font: 400 12px "Noto Sans", "Noto Sans JP", "Hiragino Sans", sans-serif; fill: #475569; }
      .box-t { font: 700 13px "Noto Sans", "Noto Sans JP", "Hiragino Sans", sans-serif; fill: #0f172a; }
      .box-s { font: 400 11px "Noto Sans", "Noto Sans JP", "Hiragino Sans", sans-serif; fill: #334155; }
      .mono { font: 600 11px "Source Code Pro", ui-monospace, SFMono-Regular, Menlo, monospace; fill: #0f172a; }
      .lbl { font: 600 11px "Noto Sans", "Noto Sans JP", "Hiragino Sans", sans-serif; fill: #1e293b; }
      .badge { font: 700 10px "Source Code Pro", ui-monospace, SFMono-Regular, Menlo, monospace; fill: #ffffff; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#15803d"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
  </defs>
  <rect class="bg" x="2" y="2" width="856" height="390" rx="14"/>
  <text class="title" x="24" y="32">MAML Subgrid Land, Autonomous EEO Biosphere, Hydrology &amp; Terrestrial C/N</text>
  <text class="sub" x="24" y="51">Every embedded CRM column owns its own land patch where vegetation, soil water, snow, wetlands, fire, and carbon emerge organically</text>
  <line x1="24" y1="62" x2="836" y2="62" stroke="#e2e8f0" stroke-width="1.2"/>
  <rect x="24" y="78" width="258" height="128" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="1.6"/>
  <rect x="218" y="85" width="56" height="17" rx="8" fill="#15803d"/>
  <text class="badge" x="246.0" y="97" text-anchor="middle">Sec. 7</text>
  <text class="box-t" x="36" y="100">1. Two-Leaf EEO Biosphere</text>
  <text class="box-s" x="36" y="118">Zero prescribed PFT maps!</text>
  <text class="box-s" x="36" y="134">Optimal chi, Vcmax25, Jmax25, C3/C4</text>
  <text class="box-s" x="36" y="150">Lambert-W0 emergent LAI &amp; canopy h_c</text>
  <text class="box-s" x="36" y="166">Evergreen vs Deciduous phenology</text>
  <text class="box-s" x="36" y="182">Emits BVOC -&gt; Secondary Organic Aero</text>
  <rect x="301" y="78" width="258" height="128" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <rect x="474" y="85" width="77" height="17" rx="8" fill="#b45309"/>
  <text class="badge" x="512.5" y="97" text-anchor="middle">Sec. 6, 8</text>
  <text class="box-t" x="313" y="100">2. 3-Source Canopy &amp; MAML Subgrid</text>
  <text class="box-s" x="313" y="118">Sunlit leaf + Shaded leaf + Ground EB</text>
  <text class="box-s" x="313" y="134">RSL Monin-Obukhov (De Ridder, 2010)</text>
  <text class="box-s" x="313" y="150">Optional Subgrid Topo lapse/aspect</text>
  <text class="box-s" x="313" y="166">Optional Dynamic Wetlands &amp; Lakes</text>
  <text class="box-s" x="313" y="182">Snow aging + SNICAR BC/Dust albedo</text>
  <rect x="578" y="78" width="258" height="128" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
  <rect x="772" y="85" width="56" height="17" rx="8" fill="#b91c1c"/>
  <text class="badge" x="800.0" y="97" text-anchor="middle">Sec. 8</text>
  <text class="box-t" x="590" y="100">3. Terrestrial C/N &amp; Wildfire</text>
  <text class="box-s" x="590" y="118">6 C pools (Leaf, Wood, Root, 3 Soil)</text>
  <text class="box-s" x="590" y="134">Prognostic Mineral N &amp; BNF</text>
  <text class="box-s" x="590" y="150">N-limitation feedback on Vcmax/LAI</text>
  <text class="box-s" x="590" y="166">SPITFIRE Fire Ignition (CRM Lightning)</text>
  <text class="box-s" x="590" y="182">Fire emits CO2, BC/OC, CH4, NOx</text>
  <rect x="24" y="240" width="396" height="134" rx="10" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/>
  <rect x="356" y="247" width="56" height="17" rx="8" fill="#0369a1"/>
  <text class="badge" x="384.0" y="259" text-anchor="middle">Sec. 8</text>
  <text class="box-t" x="36" y="262">4. 5-Layer Freeze-Thaw Soil Hydrology &amp; Heat</text>
  <text class="box-s" x="36" y="280">Implicit tridiagonal Richards water + Clapp-Hornberger retention</text>
  <text class="box-s" x="36" y="296">Dynamic root-zone water access linked to canopy height</text>
  <text class="box-s" x="36" y="312">5-layer soil heat diffusion with latent-heat zero-curtain freeze/thaw</text>
  <text class="box-s" x="36" y="328">Surface + subsurface runoff -&gt; D8 River Routing (Manning velocity)</text>
  <text class="box-s" x="36" y="344">Coastal freshwater &amp; dissolved nutrient discharge -&gt; Ocean OGCM</text>
  <rect x="440" y="240" width="396" height="134" rx="10" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.6"/>
  <rect x="744" y="247" width="84" height="17" rx="8" fill="#6b21a8"/>
  <text class="badge" x="786.0" y="259" text-anchor="middle">Sec. 8, 10</text>
  <text class="box-t" x="452" y="262">5. Land-Atmosphere Biogeochemical &amp; Dust Coupling</text>
  <text class="box-s" x="452" y="280">Wetland inundation fraction f_wet -&gt; CH4 &amp; open-water evaporation</text>
  <text class="box-s" x="452" y="296">Soil moisture + T + N -&gt; Natural soil N2O emission</text>
  <text class="box-s" x="452" y="312">Bare-soil wind friction u* -&gt; Mineral dust uplift (to Radiation/INP/Fe)</text>
  <text class="box-s" x="452" y="328">Land NBP = GPP - Ra - Rh - Fire -&gt; Prognostic atmospheric CO2</text>
  <text class="box-s" x="452" y="344">Runoff &amp; T -&gt; Silicate weathering long-term CO2 drawdown</text>
  <line x1="282" y1="142" x2="299" y2="142" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <line x1="559" y1="142" x2="576" y2="142" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <line x1="220" y1="206" x2="220" y2="238" stroke="#0284c7" stroke-width="2" marker-end="url(#arr-blue)" marker-start="url(#arr-blue)"/>
  <line x1="638" y1="206" x2="638" y2="238" stroke="#7e22ce" stroke-width="2" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <line x1="420" y1="307" x2="438" y2="307" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"/>
</svg>
