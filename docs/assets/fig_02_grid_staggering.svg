<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 412" width="860" height="412" role="img" aria-label="Horizontal SCVT-CRM Multi-Scale Grid &amp; Vertical Charney-Phillips Staggering">
  <defs>
    <style>
      .bg { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; rx: 14; }
      .title { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", sans-serif; fill: #0f172a; }
      .sub { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", sans-serif; fill: #475569; }
      .box-t { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", sans-serif; fill: #0f172a; }
      .box-s { font: 400 11px -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", sans-serif; fill: #334155; }
      .mono { font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #0f172a; }
      .lbl { font: 600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", sans-serif; fill: #1e293b; }
      .badge { font: 700 10px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #ffffff; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#15803d"/>
    </marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
  </defs>
  <rect class="bg" x="2" y="2" width="856" height="408" rx="14"/>
  <text class="title" x="24" y="32">Horizontal SCVT-CRM Multi-Scale Grid &amp; Vertical Charney-Phillips Staggering</text>
  <text class="sub" x="24" y="51">How AOBA pairs an icosahedral Voronoi global grid with embedded cloud-resolving columns and terrain-following vertical levels</text>
  <line x1="24" y1="62" x2="836" y2="62" stroke="#e2e8f0" stroke-width="1.2"/>
  <rect x="24" y="76" width="390" height="318" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4"/>
  <text class="box-t" x="38" y="98">A. Horizontal SCVT Voronoi Cell &amp; Embedded CRM (MAML)</text>
  <polygon points="150,128 228,128 266,192 228,256 150,256 112,192" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.2"/>
  <circle cx="189" cy="192" r="4" fill="#0369a1"/>
  <text class="mono" x="189" y="118" text-anchor="middle">Host SCVT Cell i (dx ~ 220 km at G5)</text>
  <text class="lbl" x="274" y="196">Normal wind u_e</text>
