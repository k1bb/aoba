[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aoba"
version = "0.1.0"
description = "AOBA (Autonomous Optimality Biosphere-Atmosphere): A GPU-native superparameterized global climate model coupled with eco-evolutionary optimality (EEO) vegetation."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Keiichi Hashimoto", email = "k1bridgebook@g.ecc.u-tokyo.ac.jp" }
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "torch>=2.2",
    "scipy>=1.10",
    "xarray>=2025.1",
    "zarr>=3.0",
    "netcdf4>=1.6",
    "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
where = ["src"]
